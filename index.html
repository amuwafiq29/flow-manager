<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7ff" />
    <title>FlowManager</title>
    <script>
      // Terapkan tema sebelum React render agar tidak flash.
      // Default "system" = mengikuti tema Windows.
      (function () {
        try {
          var m = localStorage.getItem("flowmanager-theme") || "system";
          var d =
            m === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : m;
          document.documentElement.dataset.theme = d === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
