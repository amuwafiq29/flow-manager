name: Release FlowManager

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v1.3.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Release check
        run: npm run release:check
        env:
          FM_LICENSE_SERVER_URL: ${{ secrets.FM_LICENSE_SERVER_URL }}
          FM_LICENSE_PUBKEY: ${{ secrets.FM_LICENSE_PUBKEY }}

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FM_LICENSE_SERVER_URL: ${{ secrets.FM_LICENSE_SERVER_URL }}
          FM_LICENSE_PUBKEY: ${{ secrets.FM_LICENSE_PUBKEY }}
          FM_BUILD_ID: ${{ inputs.tag }}-${{ github.sha }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: FlowManager ${{ inputs.tag }}
          releaseBody: Signed FlowManager release.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
